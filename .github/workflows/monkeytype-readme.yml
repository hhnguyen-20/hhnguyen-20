name: generate monkeytype readme svg

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  download-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Generate MonkeyType Readme SVGs
        uses: monkeytype-hub/monkeytype-readme@v1.0.0
        with:
          username: hhnguyen-20          # ← your MonkeyType username
          themes: dark                   # ← pick your MonkeyType theme
          target-branch: typing-badges   # ← branch to push SVGs to
          github-token: ${{ secrets.GITHUB_TOKEN }}


