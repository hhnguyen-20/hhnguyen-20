name: Update Typing Badges
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch MonkeyType data
        run: |
          set -euo pipefail
          APE="${{ secrets.MONKEYTYPE_APE }}"

          # 1) streak
          STREAK_RAW=$(curl -s -H "Authorization: Bearer $APE" https://api.monkeytype.com/users/streak)
          STREAK=$(jq -r '.data.length // 0' <<<"$STREAK_RAW")

          # 2) personal best for 120s
          PB_RAW=$(curl -s -H "Authorization: Bearer $APE" \
            "https://api.monkeytype.com/users/personal-bests?mode=time&mode2=120")
          PB120=$(jq -r '.data // 0' <<<"$PB_RAW")

          # 3) output JSON
          jq -n --argjson s "$STREAK" --argjson p "$PB120" \
            '{streak: $s, pb120: $p}' > public/typing.json

      - name: Publish to branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: typing-badges
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

